ill="#f2f5ed" font-family="Microsoft YaHei UI" font-size="14" font-weight="400">目录 / 保留文字顺序</text><text x="456" y="544" fill="#acb9af" font-family="Microsoft YaHei UI" font-size="13" font-weight="400">滚动条提供位置与长度反馈。</text><rect x="784" y="494" width="5" height="90" rx="2" fill="#59695e"/><rect x="784" y="514" width="5" height="36" rx="2" fill="#c0fe04"/><text x="40" y="642" fill="#acb9af" font-family="Consolas" font-size="12" font-weight="400">03 / SWITCH + STATUS</text><rect x="40" y="672" width="48" height="26" rx="13" fill="#c0fe04"/><circle cx="75" cy="685" r="9" fill="#111700"/><text x="102" y="690" fill="#f2f5ed" font-family="Microsoft YaHei UI" font-size="14" font-weight="400">Enter 发送</text><rect x="252" y="674" width="20" height="20" rx="2" fill="#c0fe04"/><text x="256" y="690" fill="#111700" font-family="Arial" font-size="14" font-weight="400">✓</text><text x="284" y="690" fill="#f2f5ed" font-family="Microsoft YaHei UI" font-size="14" font-weight="400">已选择 2 张</text><rect x="40" y="738" width="760" height="78" rx="3" fill="#202725" stroke="#59695e"/><rect x="40" y="738" width="4" height="78" rx="0" fill="#ffd289"/><text x="60" y="767" fill="#f2f5ed" font-family="Microsoft YaHei UI" font-size="16" font-weight="600">部分完成：1 张成功，1 张失败</text><text x="60" y="795" fill="#acb9af" font-family="Microsoft YaHei UI" font-size="13" font-weight="400">已保留成功结果。请查看失败原因后决定下一步。</text><rect x="856" y="183" width="544" height="635" rx="6" fill="#111614" stroke="#59695e"/><text x="880" y="214" fill="#acb9af" font-family="Consolas" font-size="12" font-weight="400">04 / DIALOG</text><rect x="888" y="268" width="480" height="362" rx="3" fill="#2b3430" stroke="#59695e"/><rect x="888" y="268" width="480" height="4" rx="0" fill="#c0fe04"/><text x="916" y="312" fill="#f2f5ed" font-family="Microsoft YaHei UI" font-size="24" font-weight="700">新建文件夹</text><text x="1328" y="310" fill="#acb9af" font-family="Arial" font-size="20" font-weight="400">×</text><text x="916" y="354" fill="#acb9af"