services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      MYSQL_DSN: "imggen:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@tcp(mysql:3306)/imggen?charset=utf8mb4&parseTime=true&loc=UTC"
      QISO_BASE_URL: "${QISO_BASE_URL:-https://api.qiso.io}"
      QISO_API_KEY: "${QISO_API_KEY:?Set QISO_API_KEY in .env}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-${APP_PASSWORD:-}}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--max-allowed-packet=128M", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: imggen
      MYSQL_USER: imggen
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u imggen -D imggen -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
