name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      business: ${{ steps.scope.outputs.business }}
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: scope
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.sha }}
        run: node scripts/ci-scope.mjs
      - if: steps.scope.outputs.tools == 'true'
        run: npm run check:tools
      - if: steps.scope.outputs.tools != 'true'
        run: npm run check:docs && node scripts/check-structure.mjs
  test:
    needs: scope
    if: needs.scope.outputs.business == 'true'
    concurrency:
      group: project-checks-mode-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-f${{ needs.scope.outputs.frontend }}-b${{ needs.scope.outputs.backend }}-i${{ needs.scope.outputs.integration }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: imggen_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Frontend checks and embedded assets
        if: needs.scope.outputs.frontend == 'true'
        run: npm run verify && npm run sync:server
        working-directory: frontend
      - name: Build embedded frontend for backend checks
        if: needs.scope.outputs.frontend != 'true'
        run: npm run build:server
        working-directory: frontend
      - name: Go vet
        if: needs.scope.outputs.backend == 'true'
        run: go vet ./...
      - name: Backend race tests and real browser integration
        if: needs.scope.outputs.backend == 'true'
        run: go test -race ./...
        env:
          TEST_MYSQL_DSN: root:integration-only@tcp(127.0.0.1:3306)/imggen_test?parseTime=true
          STUDIO_BROWSER_CHECK: '1'
      - name: Frontend integration with real Go and CSP
        if: needs.scope.outputs.integration == 'true' && needs.scope.outputs.backend != 'true'
        run: go test ./tests/go -run '^TestStudioMySQLWorkflow$' -count=1 -timeout 5m
        env:
          TEST_MYSQL_DSN: root:integration-only@tcp(127.0.0.1:3306)/imggen_test?parseTime=true
          STUDIO_BROWSER_CHECK: '1'
      - run: go build ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-check-results
          path: |
            frontend/outputs/integration/
            frontend/outputs/preview/
          if-no-files-found: ignore
          retention-days: 7
  result:
    if: always()
    needs: [scope, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BUSINESS: ${{ needs.scope.outputs.business }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$BUSINESS" = true ]; then test "$TEST_RESULT" = success; fi
