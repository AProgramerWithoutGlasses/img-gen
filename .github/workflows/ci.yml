name: Project checks
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'archive/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'archive/**'
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: imggen_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run check:tools
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run verify && npm run sync:server
        working-directory: frontend
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_MYSQL_DSN: root:integration-only@tcp(127.0.0.1:3306)/imggen_test?parseTime=true
          STUDIO_BROWSER_CHECK: '1'
      - run: go build ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-check-results
          path: |
            frontend/outputs/integration/
            frontend/outputs/preview/
          if-no-files-found: ignore
          retention-days: 7
