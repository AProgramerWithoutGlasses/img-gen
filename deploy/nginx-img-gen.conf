# Production site template for Ubuntu's packaged Nginx 1.24. TLS paths belong to
# the existing certbot installation. Do not add proxy_cache for private API data.
server {
    server_name img.xunxun.me;
    client_max_body_size 25m;
    access_log /var/log/nginx/img-gen.access.log;
    error_log /var/log/nginx/img-gen.error.log;

    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    http2_max_concurrent_streams 32;
    keepalive_requests 1000;
    ssl_certificate /etc/letsencrypt/live/img.xunxun.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.xunxun.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Restrict compression to public build assets to avoid compressing private
    # responses alongside attacker-controlled text (BREACH).
    gzip off;
    location ^~ /assets/ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css text/javascript application/javascript;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_next_upstream off;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_next_upstream off;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name img.xunxun.me;
    return 301 https://$host$request_uri;
}
